<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scritti FSA</title>
<meta name="theme-color" content="#6d1a2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scritti FSA">
<style>
:root{
  --bg:#f7f1e6; --paper:#fffaf1; --ink:#2b2420; --muted:#7a6a5d; --line:#e4d7c3;
  --wine:#6d1a2a; --wine2:#8b2a3c; --gold:#b08a3e; --gold2:#d9bf7f; --hl:#f6e3a6;
  --fs:19px; --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.sepia{--bg:#efe4cf;--paper:#f6ecd8;--ink:#3b2f22;--line:#d9c8a8}
body.dark{--bg:#17130f;--paper:#201b16;--ink:#e9dfd0;--muted:#a8998a;--line:#3a3129;--wine:#c56a7a;--wine2:#d98393;--gold:#cfae6a;--hl:#5a4a1f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--wine)}
.bar{position:sticky;top:0;z-index:20;background:var(--wine);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.bar h1{font-size:17px;min-width:0;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.bar .ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-size:20px;flex:none}
.bar .ib:active{background:rgba(255,255,255,.15)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:760px;margin:0 auto;padding:0 16px 120px}
.langs{display:flex;gap:4px;font-family:var(--sans)}
.langs button{font-size:12px;font-weight:700;padding:5px 8px;border-radius:14px;color:#f3dfe3;letter-spacing:.05em}
.langs button.on{background:var(--gold2);color:var(--wine)}
/* home */
.hero{text-align:center;padding:28px 8px 14px}
.hero .orn{color:var(--gold);font-size:22px;letter-spacing:.4em}
.hero h2{font-weight:500;font-size:28px;margin:6px 0 2px;color:var(--wine);letter-spacing:.03em}
.hero p{margin:0;color:var(--muted);font-style:italic}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 2px rgba(80,50,20,.06)}
.thought{border-left:4px solid var(--gold)}
.thought .lbl,.sec-h{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.thought blockquote{margin:8px 0 6px;font-size:18px;line-height:1.55;font-style:italic}
.thought .src{font-size:13px;color:var(--muted)}
.sec-h{margin:26px 4px 6px;color:var(--wine)}
.work{display:flex;gap:14px;align-items:center;padding:14px 16px;margin:8px 0;background:var(--paper);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left}
.work:active{background:var(--bg)}
.work .ic{flex:none;width:42px;height:54px;border-radius:4px 7px 7px 4px;background:linear-gradient(135deg,var(--wine),var(--wine2));color:var(--gold2);display:grid;place-items:center;font-size:20px;box-shadow:inset 3px 0 0 rgba(0,0,0,.2)}
.work .tx{flex:1;min-width:0}
.work .t{font-size:18px;color:var(--ink)}
.work .s{font-size:14px;color:var(--muted);font-style:italic;margin-top:2px}
.badge{display:inline-block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:8px;background:var(--line);color:var(--muted);margin-top:5px;text-transform:uppercase}
.badge.ok{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.cont{display:flex;align-items:center;gap:12px}
.cont .tx{flex:1}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:9px 14px;border-radius:20px;background:var(--wine);color:#fff}
.btn.sec{background:transparent;color:var(--wine);border:1px solid var(--wine)}
/* porte e scaffali */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.door{display:flex;gap:10px;align-items:center;text-align:left;padding:13px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(80,50,20,.06);min-width:0}
.door:active{background:var(--bg)}
.door .di{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--wine);color:var(--gold2)}
.door .di svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.door .dt{font-size:16.5px;color:var(--ink);line-height:1.2}
.door .ds{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.25}
details.shelf{padding:0 10px}
details.shelf summary{align-items:center;gap:10px;justify-content:flex-start}
details.shelf summary .sn{flex:1}
details.shelf summary .sc{font-family:var(--sans);font-size:12px;color:var(--muted)}
details.shelf .work{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;margin:0;padding:12px 4px}
.scheda{font-size:16px;line-height:1.5;margin:6px 0 14px}
.scheda .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:10px}
.scheda .meta b{color:var(--gold);font-weight:700;letter-spacing:.04em;text-transform:capitalize}
.copybar{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));z-index:35;display:none;justify-content:center;pointer-events:none}
.copybar button{pointer-events:auto;font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 18px;border-radius:24px;background:var(--wine);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tcard{text-align:left;padding:14px 12px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;font-size:16.5px;line-height:1.25;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font-family:var(--sans);font-size:13.5px;padding:7px 12px;border-radius:18px;border:1px solid var(--wine);color:var(--wine);background:transparent}
.chip.fill{background:var(--wine);color:#fff}
.tl{list-style:none;margin:10px 0;padding:0;border-left:2px solid var(--gold2);margin-left:8px}
.tl li{position:relative;padding:8px 0 12px 18px}
.tl li::before{content:"";position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--gold)}
.tl li.ev::before{background:var(--wine);border-color:var(--wine)}
.tl .yy{font-family:var(--sans);font-weight:700;font-size:14px;color:var(--wine);letter-spacing:.04em}
.tl .et{font-size:16.5px;line-height:1.4;margin:2px 0 4px}
.tl .chip{font-size:12.5px;padding:5px 10px}
.life{border-left:4px solid var(--wine)}
.life .lbl{color:var(--wine)}
.life .d{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:2px}
.lev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.lev:first-of-type{border-top:0}
.lev .y{flex:none;font-family:var(--sans);font-weight:700;font-size:14px;color:var(--gold);min-width:40px}
.lev .x{font-size:16.5px;line-height:1.45}
.lev .ag{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:1px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.daynav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-size:20px;color:var(--wine)}
.daynav .dn{font-size:20px;color:var(--wine)}
/* toc */
.whead{padding:22px 4px 8px;text-align:center}
.whead h2{margin:0;color:var(--wine);font-weight:500;font-size:26px}
.whead .s{color:var(--muted);font-style:italic;margin-top:4px}
.whead .a{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:6px}
.notice{font-family:var(--sans);font-size:13.5px;line-height:1.45;background:#fbf0d4;color:#6b5320;border:1px solid #ead39a;border-radius:10px;padding:10px 12px;margin:10px 0}
body.dark .notice{background:#3a3020;color:#e8d4a2;border-color:#5a4a2a}
.toc{list-style:none;margin:0;padding:0}
.toc li button{display:flex;width:100%;text-align:left;padding:11px 6px;border-bottom:1px solid var(--line);gap:10px;align-items:baseline}
.toc li .n{font-family:var(--sans);font-size:12px;color:var(--gold);min-width:26px}
.toc li .tt{flex:1;font-size:16.5px}
.toc li .ss{display:block;font-size:13px;color:var(--muted);font-style:italic}
.toc li.cur .tt{color:var(--wine);font-weight:600}
details.grp{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 12px}
details.grp summary{padding:13px 4px;font-size:17px;color:var(--wine);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.grp summary::after{content:"＋";font-family:var(--sans);color:var(--gold)}
details.grp[open] summary::after{content:"－"}
.filter{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:8px 0}
/* reader */
.reader{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin:14px -6px;padding:26px 22px 30px;box-shadow:0 1px 3px rgba(80,50,20,.07)}
.reader .rt{text-align:center;color:var(--wine);font-size:calc(var(--fs) * 1.15);font-weight:500;margin:0 0 4px;letter-spacing:.02em}
.reader .rs{text-align:center;color:var(--muted);font-style:italic;font-size:calc(var(--fs) * .85);margin-bottom:6px}
.reader .orn{text-align:center;color:var(--gold);letter-spacing:.5em;margin:6px 0 18px}
.txt{font-size:var(--fs);line-height:1.62;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.txt.memo{position:relative;padding-left:36px}
.txt.memo .mpg{font-size:0;color:transparent}
.txt.memo .mpg::after{content:"";display:inline-block;width:2px;height:14px;background:var(--wine);margin:0 3px;vertical-align:-2px}
.txt.memo .pgm{position:absolute;left:0;width:30px;text-align:right;color:var(--wine);font-family:var(--sans);font-size:15px;font-weight:700;line-height:calc(var(--fs) * 1.62);pointer-events:none}
.txt p{margin:0 0 .75em;text-align:justify}
.txt p.nun{text-align:left;margin:0;line-height:1.55;padding-left:1.4em}.txt p.com{text-align:left;margin:.8em 0 .15em;padding-left:.4em}.txt p.com em{font-style:normal}
.txt.memo h4{font-weight:700}
.txt.memo h4.tit{font-weight:400;font-variant:small-caps;letter-spacing:.04em;font-size:1.08em}
.txt.memo h4.tit.sez{font-size:.92em}
.txt h3,.txt h4{font-weight:600;color:var(--wine);font-size:1em;text-align:center;margin:1.3em 0 .6em}
.txt blockquote{margin:.6em 1.2em;font-style:italic;text-align:justify}
.txt li,.txt div{text-align:justify}
.txt.fl ol,.txt.fl ul{padding-left:0;margin:0 0 .75em;list-style-position:inside}.txt.fl li{margin:0 0 .75em;text-align:justify}.txt.fl li>p{display:inline;margin:0}
.txt p.marg{font-family:var(--sans);font-size:.8em;font-style:italic;line-height:1.35;color:var(--gold);text-align:left;margin:0 0 .1em 1.4em;padding-left:.7em;border-left:2px solid var(--gold)}.txt p:not(.marg)+p.marg,.txt li+p.marg,.txt ol+p.marg,.txt ul+p.marg,.txt h3+p.marg,.txt h4+p.marg{margin-top:.9em}.txt p.marg+p:not(.marg),.txt p.marg+ol,.txt p.marg+ul,.txt p.marg+li{margin-top:.9em}.txt p.nota{font-size:.78em;line-height:1.45;color:var(--muted);text-align:justify}
.txt img{max-width:100%}
.txt table{border-collapse:collapse;font-size:.85em}
.txt td,.txt th{border:1px solid var(--line);padding:3px 6px}
.txt hr{border:0;text-align:center;margin:1.2em 0}
.txt hr::after{content:"✦";color:var(--gold)}
.footnote-ref{text-decoration:none;color:var(--wine);font-weight:700;padding:0 2px}
.footnote-ref sup{font-size:.68em}
mark{background:var(--hl);color:inherit;border-radius:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
.nav button{flex:1;font-family:var(--sans);font-size:14px;padding:12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);color:var(--wine)}
.nav button[disabled]{opacity:.35}
.progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:transparent;z-index:30}
.progress i{display:block;height:100%;background:var(--gold);width:0}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,5,.35);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:18px 18px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;box-shadow:0 -6px 24px rgba(0,0,0,.2);transform:translateY(110%);transition:transform .22s ease;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet-bg.on{display:block}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h4{margin:0 0 10px;font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sheet .txt{font-size:calc(var(--fs) * .9)}
/* Persone/fondazioni cliccabili */
.plink{border-bottom:1px dotted var(--gold);cursor:pointer;color:inherit;background:none;padding:0;font:inherit;text-decoration:none}
.plink:hover{color:var(--wine)}
/* Scheda persona nel popup */
.scheda-persona h4{margin:0 0 .5em}
.scheda-persona .scheda-bio{margin-bottom:1em}
.scheda-persona .vol-label{margin:1.1em 0 .3em;color:var(--gold);font-size:.85em;border-top:1px solid var(--line,#ddd);padding-top:.6em}.scheda-persona .vol-label:first-child{border-top:0;margin-top:0;padding-top:0}
.scheda-persona .scheda-refs h5{font-size:13px;font-weight:600;color:var(--wine);margin:.8em 0 .3em;text-transform:uppercase;letter-spacing:.04em}
.scheda-persona .scheda-refs .ref-btn{display:block;width:100%;text-align:left;background:none;border:none;padding:5px 0;cursor:pointer;font:inherit;font-size:13.5px;color:var(--link);border-bottom:1px solid var(--line)}
.scheda-persona .scheda-refs .ref-btn:last-child{border-bottom:none}
.scheda-persona .scheda-refs .ref-btn:hover{color:var(--wine)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:15px;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.seg button{padding:7px 12px;font-size:14px}
.seg button.on{background:var(--wine);color:#fff}
/* search */
.sbox{display:flex;gap:8px;margin:16px 0 8px}
.sbox input{flex:1;font:inherit;font-size:17px;padding:11px 16px;border-radius:24px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.scope{font-family:var(--sans);font-size:14px;color:var(--muted);display:flex;gap:14px;align-items:center;margin:4px 6px 10px}
.res{padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;display:block}
.res .w{font-family:var(--sans);font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.04em}
.res .c{font-size:15px;color:var(--wine);margin:2px 0}
.res .x{font-size:15px;line-height:1.45;color:var(--ink)}
.muted{color:var(--muted);font-family:var(--sans);font-size:14px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--wine);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--muted);font-size:13px;font-family:var(--sans);margin:40px 0 10px;line-height:1.5}
.bm{list-style:none;padding:0;margin:0}
.bm li{border-bottom:1px solid var(--line);padding:4px 0}
.bm li .row{display:flex;align-items:center}
.bm li button.go{flex:1;text-align:left;padding:12px 4px}
.bm .del{color:var(--muted);font-family:var(--sans);padding:10px}
.noteBox{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:0 0 8px;font-family:var(--sans);font-size:13px;background:transparent;color:inherit;resize:vertical;min-height:34px}
.seltoolbar{position:fixed;z-index:60;display:flex;gap:2px;background:var(--wine);border-radius:20px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.seltoolbar button{background:none;border:none;color:#fff;font-family:var(--sans);font-size:12.5px;padding:7px 10px;border-radius:14px;white-space:nowrap}
.seltoolbar button:active{background:rgba(255,255,255,.22)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;font-family:var(--sans);opacity:0;transition:opacity .25s,transform .25s;z-index:80;pointer-events:none;max-width:85vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.errq{list-style:none;padding:0;margin:0}
.errq li{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}
.errq .del{float:right;color:var(--muted);font-family:var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;font-size:13px;font-family:var(--sans);border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--ink)}
.chips button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.empty{text-align:center;color:var(--muted);font-style:italic;padding:30px 0}
@media (max-width:420px){.langs button{padding:5px 6px;font-size:11.5px}.bar .ib{width:34px}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <button class="ib" id="back" aria-label="Indietro" style="visibility:hidden"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title">Scritti FSA</h1>
  <div class="langs" id="langs"></div>
  <button class="ib" id="bsearch" aria-label="Cerca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <button class="ib" id="bmenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<main id="main"></main>
<div class="progress"><i id="prog"></i></div>
<div class="copybar" id="copybar"><button id="copybtn"></button></div>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetc"></div></div>

<script>
'use strict';
/* ------------------------------------------------------------------ testi dell'interfaccia */

// Opere il cui testo digitale (OCR) è spezzato in righe: le righe vengono riunite in paragrafi alla lettura
const JOIN=new Set(['lettere','docbase']);
function joinLines(h){
  const d=document.createElement('div');d.innerHTML=h;
  let el=d.firstElementChild;
  while(el){
    const nx=el.nextElementSibling;
    if(nx&&el.tagName==='P'&&nx.tagName==='P'&&!el.className&&!nx.className){
      const ta=el.textContent.trim(),tb=nx.textContent.trim();
      if(ta&&tb&&!/[.!?:;»”"\)\]…]$/.test(ta)&&/^[a-zà-ÿ]/.test(tb)){
        if(/[A-Za-zÀ-ÿ]-$/.test(ta))el.innerHTML=el.innerHTML.replace(/-\s*$/,'')+nx.innerHTML.trim();
        else el.innerHTML=el.innerHTML.trimEnd()+' '+nx.innerHTML.trim();
        nx.remove();continue;
      }
    }
    el=nx;
  }
  return d.innerHTML;
}

function dayThought(){
  const w=W('fili');if(!w)return Promise.resolve(null);
  const l=effLang(w,LANG);
  return index(w,l).then(async ix=>{
    const d=new Date();const seed=d.getFullYear()*400+d.getMonth()*32+d.getDate();
    const cands=[];for(let i=0;i<ix.toc.length;i++)if(!ix.toc[i].x)cands.push(i);
    const i=cands[2+seed%(Math.max(1,cands.length-3))]||1;
    const s=await section(w,l,i);
    const div=document.createElement('div');div.innerHTML=s.html;
    const all=[...div.querySelectorAll('p')],ps=[];
    const isRef=p=>{const t=p.textContent.trim();return (p.children.length===1&&p.children[0].tagName==='EM'&&p.children[0].textContent.trim()===t)||/^\*[\s*]*$/.test(t)};
    all.forEach((p,k)=>{if(isRef(p))return;const t=p.textContent.trim();if(t.length<60||t.length>420||/^\d+$/.test(t))return;
      const nx=all[k+1],ref=nx&&isRef(nx)&&!/^\*/.test(nx.textContent.trim())?nx.textContent.trim():'';ps.push({t,ref})});
    if(!ps.length)return null;
    const q=ps[seed%ps.length];
    return {t:q.t,src:wTitle(w)+' — '+s.e.t+(q.ref?' · '+q.ref:''),i}
  }).catch(()=>null)
}

const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const RE_DM=new RegExp('(\\d{1,2})(?:\\s*-\\s*\\d{1,2})?[°º]?\\s+('+MESI.join('|')+')','i'),RE_M=new RegExp(MESI.join('|'),'i');
function lClean(s){return (s||'').replace(/\[\^\d+\]|\^\d+\^|[\[\]]/g,'').replace(/\s+/g,' ').trim()}
function lInfo(e){
  if(e._i)return e._i;
  const s=lClean(e.s).replace(/(\d{4})\d{1,3}$/,'$1');
  const y=e.s?((s.match(/18\d\d/)||[])[0]||''):'';const dm=s.match(RE_DM),mm=s.match(RE_M);
  let pl=s.includes(',')?s.split(',')[0].trim():'';if(/\d/.test(pl)||pl.length>30)pl='';
  let to=e.s?lClean((e.t||'').replace(/^\d+\.\s*/,'')).replace(/^(?:all['’]\s*|(?:alla|allo|alle|agli|al|ai|a)\s+)/i,'').replace(/\bSr\. a\./g,'Sr. A.'):'';
  if(to)to=to[0].toUpperCase()+to.slice(1);
  const k=norm(to).replace(/\b(sr|suor|a|m)\b\.?/g,' ').replace(/[^a-z]+/g,' ').trim();
  return e._i={y,mo:mm?MESI.indexOf(mm[0].toLowerCase())+1:0,d:dm?+dm[1]:0,pl,to,k};
}
function letterGroups(ix,mode){
  const map=new Map();
  ix.toc.forEach((e,i)=>{if(e.x)return;const f=lInfo(e);let key,label;
    if(mode==='year'){key=f.y;label=f.y}else if(mode==='place'){key=f.pl;label=f.pl}else{key=f.k;label=f.to}
    if(!key){key=e.s?'~':'~~';label=e.s?T().undated:T().extras}
    if(!map.has(key))map.set(key,{n:label,key,items:[],lb:{}});const G=map.get(key);G.items.push([e,i]);G.lb[label]=(G.lb[label]||0)+1});
  if(mode==='to')map.forEach(G=>{G.n=Object.keys(G.lb).sort((x,y)=>G.lb[y]-G.lb[x])[0]});
  const gs=[...map.values()];
  gs.sort((a,b)=>(a.key[0]==='~')-(b.key[0]==='~')||(a.key[0]==='~'?a.key.localeCompare(b.key):0)||(mode==='year'?a.key.localeCompare(b.key):b.items.length-a.items.length||a.n.localeCompare(b.n)));
  return gs;
}

function highlight(root,q){
  const nq=norm(q);if(!nq)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node,first=null;
  const nodes=[];while(node=walker.nextNode())nodes.push(node);
  for(const t of nodes){const nt=norm(t.nodeValue);let k=nt.indexOf(nq);if(k<0)continue;
    const r=document.createRange();r.setStart(t,k);r.setEnd(t,Math.min(t.nodeValue.length,k+q.length));
    const m=document.createElement('mark');try{r.surroundContents(m)}catch(e){continue}
    if(!first)first=m}
  if(first)setTimeout(()=>first.scrollIntoView({block:'center'}),60);
}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘`´]/g,"'").replace(/\s+/g,' ');
let searchTok=0,PENDING_Q=null;
function searchView(id){
  const w=id&&W(id);
  renderBar(T().search,true);

  let h=`<div class="sbox"><input id="q" type="search" placeholder="${esc(T().searchPh)}" value="${esc(store.get('lastq',''))}" enterkeyhint="search"><button class="btn" id="go">${esc(T().search)}</button></div>`;

  h+=`<div id="st" class="muted"></div><div id="res"></div>`;
  $('#main').innerHTML=h;
  const q=$('#q');q.focus();
  const run=()=>{const sc=w?(document.querySelector('input[name=sc]:checked')||{}).value:'all';store.set('scope',sc);doSearch(q.value,sc==='work'?[w]:CAT)};
  $('#go').onclick=run;q.onkeydown=e=>{if(e.key==='Enter')run()};
  if(PENDING_Q){q.value=PENDING_Q;PENDING_Q=null;const a=document.querySelector('input[name=sc][value=all]');if(a)a.checked=true;run()}
}
async function doSearch(q,works){
  q=q.trim();if(q.length<2)return;store.set('lastq',q);
  const tok=++searchTok;const nq=norm(q);
  const res=$('#res'),st=$('#st');res.innerHTML='';let count=0;const MAX=300;
  st.innerHTML=`<span class="spin"></span>${esc(T().searching)}`;
  const tmp=document.createElement('div');
  for(const w of works){const l=effLang(w,LANG);let ix;
    try{ix=await index(w,l)}catch(e){continue}
    for(let c=0;c<ix.chunks;c++){
      let ch;try{ch=await chunk(w,l,c)}catch(e){continue}
      if(tok!==searchTok)return;
      let out='';
      for(const s of ch.sections){
        tmp.innerHTML=s.h;const text=tmp.textContent.replace(/\s+/g,' ');const nt=norm(text);
        let k=nt.indexOf(nq);if(k<0)continue;
        const a=Math.max(0,k-70),b=Math.min(text.length,k+q.length+90);
        const snip=(a>0?'…':'')+esc(text.slice(a,k))+'<mark>'+esc(text.slice(k,k+q.length))+'</mark>'+esc(text.slice(k+q.length,b))+(b<text.length?'…':'');
        const e=ix.toc[s.i];count++;
        out+=`<button class="res" onclick="PENDING_HL=${esc(JSON.stringify(q))};location.hash='#r-${w.id}-${s.i}'"><div class="w">${esc(wTitle(w))}</div><div class="c">${esc(e.t)}${e.s?' · '+esc(e.s):''}</div><div class="x">${snip}</div></button>`;
        if(count>=MAX)break}
      if(out)res.insertAdjacentHTML('beforeend',out);
      st.innerHTML=`<span class="spin"></span>${esc(T().searching)} ${count} ${esc(T().results)}`;
      if(count>=MAX)break}
    if(count>=MAX)break}

    h+=`<li class="${o.ev.length?'ev':''}"><div class="yy">${y}</div>${o.ev.map(e=>`<div class="et">${esc(e.t)}${e.u?` <button class="chip" style="margin-left:4px" onclick="location.hash='${e.u}'">${esc(T().bio)}</button>`:''}</div>`).join('')}${o.chips.length?`<div class="chips">${o.chips.join('')}</div>`:''}</li>`});
  h+=`</ul>`;
  if(!location.hash.startsWith('#c'))return;
  $('#main').innerHTML=h;window.scrollTo(0,0);
}

/* ------------------------------------------------------------------ copia con riferimento */
let SELTXT='';
document.addEventListener('selectionchange',()=>{
  const s=getSelection();const bar=$('#copybar');if(!bar)return;
  const tx=$('#txt');const t=s&&!s.isCollapsed?s.toString().trim():'';
  SELTXT=(t&&readerState&&tx&&s.anchorNode&&tx.contains(s.anchorNode))?t:'';
  if(SELTXT){$('#copybtn').textContent=T().copyRef;bar.style.display='flex'}else bar.style.display='none';
});
function refText(){
  const r=readerState;if(!r)return '';
  const e=r.e||{};const parts=[r.w.author,wTitle(r.w),e.g?e.g.replace('Volume',T().vol):'',e.t,e.s?lClean(e.s):''].filter(Boolean);
  return `«${SELTXT.replace(/\s+/g,' ')}» (${parts.join(', ')})`;
}
$('#copybtn').addEventListener('pointerdown',e=>e.preventDefault());
$('#copybtn').addEventListener('click',async()=>{
  const txt=refText();if(!txt)return;
  try{await navigator.clipboard.writeText(txt);$('#copybtn').textContent=T().copied;setTimeout(()=>{$('#copybar').style.display='none'},1300)}
  catch(e){openSheet(`<h4>${esc(T().copyManual)}</h4><textarea readonly style="width:100%;height:9em;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)" onfocus="this.select()">${esc(txt)}</textarea>`)}
});

}

/* numeri delle pagine del manoscritto: nel margine sinistro, all'altezza della riga in cui la pagina comincia */
let _memoRO=null;
function marginNums(txt){
  if(_memoRO){_memoRO.disconnect();_memoRO=null}
  if(!txt)return;
  txt.classList.add('memo');
  txt.querySelectorAll('strong').forEach(s=>{
    const t=s.textContent.trim();
    if(/^\d{1,3}(\/\d)?$/.test(t)){s.classList.add('mpg');s.dataset.n=t}
  });
  let raf=0;
  const lay=()=>{
    raf=0;
    txt.querySelectorAll('.pgm').forEach(e=>e.remove());
    const base=txt.getBoundingClientRect();
    const frag=document.createDocumentFragment();
    txt.querySelectorAll('strong.mpg').forEach(s=>{
      const r=s.getBoundingClientRect();
      const m=document.createElement('span');m.className='pgm';m.textContent=s.dataset.n;
      m.style.top=(r.top-base.top)+'px';frag.appendChild(m);
    });
    txt.appendChild(frag);
  };
  const go=()=>{if(!raf)raf=requestAnimationFrame(lay)};
  if(window.ResizeObserver){_memoRO=new ResizeObserver(go);_memoRO.observe(txt)}
  go();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);
}
/* ------------------------------------------------------------------ persone/fondazioni popup */
let _personeData=null,_fondazioniData=null,_aliasRe=null;
async function loadPersone(){
  if(_personeData)return _personeData;
  try{const r=await fetch('data/lettere/persone.json');_personeData=await r.json()}catch(e){_personeData=[]}
  return _personeData;
}
async function loadFondazioni(){
  if(_fondazioniData)return _fondazioniData;
  try{const r=await fetch('data/lettere/fondazioni.json');_fondazioniData=await r.json()}catch(e){_fondazioniData=[]}
  return _fondazioniData;
}
// Corpus label leggibili
const CORPUS_LABEL={'lettere':'Lettere','memorie':'Memorie','travagli':'Travagli e Conforti'};
function renderSchedaPersona(p){
  const bio=p.scheda_html||'';
  let refs_html='';
  if(p.refs&&p.refs.length){
    // raggruppa per corpus
    const byCorpus={};
    for(const r of p.refs){
      const c=r.corpus;if(!byCorpus[c])byCorpus[c]=[];
      byCorpus[c].push(r);
    }
    refs_html='<div class="scheda-refs">';
    for(const [corpus,list] of Object.entries(byCorpus)){
      refs_html+=`<h5>${esc(CORPUS_LABEL[corpus]||corpus)}</h5>`;
      for(const r of list.slice(0,20)){
        const label=r.label&&r.label!==`sezione ${r.section_i}`?r.label:`${CORPUS_LABEL[corpus]||corpus} — vol. ${r.file_num+1}`;
        refs_html+=`<button class="ref-btn" onclick="closeSheet();location.hash='#r-${esc(r.corpus)}-${r.section_i}'">${esc(label)}</button>`;
      }
      if(list.length>20)refs_html+=`<div class="muted" style="font-size:12px;padding:4px 0">… e altri ${list.length-20}</div>`;
    }
    refs_html+='</div>';
  }
  return `<div class="scheda-persona"><h4>${esc(p.nome_display)}</h4><div class="scheda-bio txt">${bio}</div>${refs_html}</div>`;
}
function openPersonaSheet(id){
  Promise.all([loadPersone(),loadFondazioni()]).then(([persone,fondazioni])=>{
    const all=[...persone,...fondazioni];
    const p=all.find(x=>x.id===id);
    if(!p)return;
    openSheet(renderSchedaPersona(p));
    $('#sheet').scrollTop=0;
  });
}

// Applica link al testo delle lettere dopo il rendering
async function annotateLettere(txtEl){
  if(!txtEl)return;
  const [persone,fondazioni]=await Promise.all([loadPersone(),loadFondazioni()]);
  const all=[...persone,...fondazioni];
  // Costruisce mappa alias->id, solo alias >= 5 chars per sicurezza
  const aliasMap=new Map();
  for(const p of all){
    for(const a of (p.aliases||[])){
      if(a.length>=5&&!aliasMap.has(a))aliasMap.set(a,p.id);
    }
    // il cognome da solo e' gia' tra gli alias solo quando non e' ambiguo (vedi build_persone.py)
    if(p.luogo&&p.luogo.length>=5){
      const nl=norm(p.luogo);
      if(!aliasMap.has(nl))aliasMap.set(nl,p.id);
    }
  }
  // Ordina alias per lunghezza decrescente (match più specifici prima)
  if(!_aliasRe){
    _aliasRe=[...aliasMap.entries()].sort((a,b)=>b[0].length-a[0].length).map(([alias,id])=>
      [alias,id,new RegExp('(?<![a-zàèéìòùâêîôûäëïöü])'+alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-zàèéìòùâêîôûäëïöü])')]);
  }
  const aliases=_aliasRe;

  // Annota i nodi testo in txtEl evitando <h3><h4> (intestazioni) e già annotati
  const walker=document.createTreeWalker(txtEl,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      let el=node.parentElement;
      while(el&&el!==txtEl){
        if(['H3','H4','H5','BUTTON','A','MARK'].includes(el.tagName))return NodeFilter.FILTER_REJECT;
        if(el.classList&&el.classList.contains('plink'))return NodeFilter.FILTER_REJECT;
        el=el.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[];
  let n;while(n=walker.nextNode())nodes.push(n);

  for(const textNode of nodes){
    const orig=textNode.nodeValue;
    const normed=norm(orig);
    // cerca il primo match
    let best=null,bestStart=-1;
    for(const [alias,id,re] of aliases){
      if(!normed.includes(alias))continue;
      const m=normed.match(re);
      if(m&&(bestStart<0||m.index<bestStart)){bestStart=m.index;best={alias,id,index:m.index,len:alias.length};break}
    }
    if(!best||bestStart<0)continue;
    // Trova la posizione nel testo originale (cerca la stessa sottostringa case-insensitive)
    // Usa bestStart come offset approssimativo
    const before=orig.slice(0,bestStart);
    const matched=orig.slice(bestStart,bestStart+best.len);
    const after=orig.slice(bestStart+best.len);
    if(!matched.trim())continue;
    const frag=document.createDocumentFragment();
    if(before)frag.appendChild(document.createTextNode(before));
    const span=document.createElement('button');
    span.className='plink';
    span.textContent=matched;
    span.setAttribute('data-pid',best.id);
    span.onclick=function(e){e.stopPropagation();openPersonaSheet(this.dataset.pid)};
    frag.appendChild(span);
    if(after)frag.appendChild(document.createTextNode(after));
    textNode.parentNode.replaceChild(frag,textNode);
  }
}
